name: Replace index.html with fixed build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with fixed build
        run: |
          git rm index.html
          git mv critter-potato-gun-v10.21.37-landing2-OBFUSCATED.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace index.html with fixed build"
          git push
